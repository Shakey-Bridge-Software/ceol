# ---------------------------------------------------------------------------
# nginx cache headers for a statically-deployed ceol build.
#
# This is a *snippet* of location blocks only — NOT a full server block. It is
# meant to be `include`d from inside your site's `server { ... }` block, e.g.:
#
#     server {
#         listen 80;
#         server_name example.com;
#         root /var/www/html;
#
#         include /etc/nginx/conf.d/ceol-cache.conf;
#
#         # ...any other locations...
#     }
#
# Strategy (matches release.sh + fingerprint.sh):
#   * index.html      -> `no-cache`  (revalidated every load; always points at
#                                     the newest fingerprinted asset URLs)
#   * /js/*.js /css/* -> hashed filenames that change on every release, so they
#                        can be cached forever (`immutable`) — browsers only
#                        fetch them when the URL actually changes
#   * /data/*.edn     -> runtime-fetched defaults; revalidate so fresh releases
#                        propagate without a hard refresh
# ---------------------------------------------------------------------------

# Never cache index.html — it always points at the newest hashed asset URLs.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Fingerprinted, immutable static assets (js/main.<hash>.js, css/style.<hash>.css).
location ~* \.(?:js|css|map|svg|woff2?|png|jpe?g|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# Runtime-fetched EDN defaults — revalidate every load.
location ~* \.edn$ {
    add_header Cache-Control "no-cache";
}

